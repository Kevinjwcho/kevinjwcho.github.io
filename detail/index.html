<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jinwoo Cho</title>
<meta name="author" content="Jinwoo Cho" />
<meta name="description" content="Jinwoo Cho — Special Faculty (Post-Doctoral Fellow), Department of Statistics, Carnegie Mellon University. Network data analysis, dynamic prediction in survival analysis, high-dimensional data with network structure." />
<link rel="canonical" href="https://kevinjwcho.github.io/" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Jinwoo Cho" />
<meta property="og:description" content="Predicting risk from data that arrive over time, on networks, and in high dimensions." />
<meta property="og:url" content="https://kevinjwcho.github.io/" />
<meta property="og:image" content="https://kevinjwcho.github.io/assets/img/prof_pic.jpg" />
<meta name="twitter:card" content="summary" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#1A1C1D;--accent:#0066CC;--line:#E7E8E9;--hair:#F0F1F1;--panel:#F3F4F4;--body:#43464A;--mute:#43464A;--label:#61666A;--faint:#6E7174;--serif:'Schibsted Grotesk','Instrument Sans',system-ui,sans-serif;--sans:'Instrument Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
  .label,.more,.kind,.meta,.back,.tl .y,.news .d{font-family:var(--mono)!important;font-weight:500!important}
  h1,h2,h3{font-family:var(--serif);font-weight:500!important;letter-spacing:-.025em}
  .row .t,.tl .b .n{font-family:var(--serif);font-weight:500;letter-spacing:-.015em}
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  a{color:var(--ink);text-decoration:none}
  a:hover{color:var(--accent)}
  ::selection{background:var(--accent);color:#fff}
  h1,h2,h3{font-weight:400;margin:0;letter-spacing:-0.02em;text-wrap:pretty}
  p{margin:0;text-wrap:pretty}
  ul{list-style:none;padding:0;margin:0}
  .shell{padding:0 clamp(20px,5vw,72px)}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding:22px 0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .topbar .name{font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:-.015em}
  .topbar nav{display:flex;gap:24px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;flex-wrap:wrap}
  .topbar nav a{color:var(--label)}
  .topbar nav a:hover,.topbar nav a[data-active="1"]{color:var(--accent)}
  .frame{display:grid;grid-template-columns:clamp(0px,calc((100vw - 1040px) * 10),160px) minmax(0,1fr);align-items:start}
  .rail{position:sticky;top:26px;overflow:hidden}
  .rail .cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--label);margin:44px 20px 0 0;padding-bottom:12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .rail .items{display:flex;flex-direction:column;gap:2px;margin-right:20px;padding-top:12px}
  .rail a{display:flex;gap:9px;font-family:var(--mono);font-size:11.5px;color:var(--faint);padding:5px 0;white-space:nowrap}
  .rail a span:first-child{color:var(--label)}
  .rail a:hover,.rail a[data-active="1"],.rail a[data-active="1"] span:first-child{color:var(--accent)}
  main{min-width:0}
  .hero{margin:14px 0 clamp(30px,4vw,48px);background-color:var(--panel);background-image:radial-gradient(#DBDDDE 1px,transparent 1px);background-size:20px 20px;border-radius:20px;padding:clamp(30px,4.4vw,52px) clamp(26px,4vw,52px);animation:enter .5s cubic-bezier(.2,.7,.2,1) both}
  .hero .eyebrow{display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--label);margin-bottom:clamp(28px,4vw,48px)}
  .hero .eyebrow a{color:var(--accent)}
  .hero h1{font-family:var(--serif);font-size:clamp(34px,5vw,64px);line-height:1.03;letter-spacing:-.032em;text-wrap:balance}
  .hero .plead{margin:20px 0 0;font-size:clamp(16.5px,1.5vw,19px);line-height:1.6;color:var(--body);max-width:60ch}
  .hero .acts{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
  .lead{font-size:clamp(19px,2vw,25px);line-height:1.44;letter-spacing:-0.01em;max-width:24em}
  .intro{margin-top:20px;font-size:17px;line-height:1.74;color:var(--body);max-width:36em}
  section{padding:clamp(36px,5vw,60px) 0;border-top:1px solid var(--line)}
  section:first-child{border-top:0;padding-top:0}
  .label{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--label);margin:0}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:clamp(20px,3vw,30px)}
  .more{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(22px,2.6vw,34px);align-items:start}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .card{display:grid;gap:0;align-content:start;cursor:pointer}
  .card .rule{height:2px;background:var(--line);margin-bottom:14px;transition:background .2s ease}
  .card:hover .rule{background:var(--accent)}
  .kind{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
  .meta{font-family:var(--sans);font-size:11px;color:var(--faint)}
  .card .top{display:flex;gap:10px;align-items:baseline;margin-bottom:5px}
  .card h3{font-weight:500;font-size:clamp(20px,2.1vw,24px);line-height:1.2;letter-spacing:-0.012em}
  .card .reveal{max-height:0;opacity:0;overflow:hidden;transition:max-height .4s cubic-bezier(.2,.7,.2,1),opacity .28s ease}
  .card:hover .reveal,.card:focus-visible .reveal{max-height:360px;opacity:1}
  .card .fig{margin-top:14px;padding:16px 14px;background:var(--panel);border:1px solid var(--line)}
  .card .reveal p{margin-top:12px;font-family:var(--sans);font-size:13.5px;line-height:1.66;color:var(--mute);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .sw{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:baseline;padding:18px 20px;background:var(--panel);border-left:2px solid var(--accent);margin-bottom:12px}
  .sw .name{font-family:var(--sans);font-size:15px;font-weight:600}
  .sw p{font-family:var(--sans);font-size:13.5px;line-height:1.66;color:var(--mute)}
  .row{padding:20px 0;border-bottom:1px solid var(--line);transition:transform .24s cubic-bezier(.2,.7,.2,1)}
  .row:hover{transform:translateX(5px)}
  .row .t{font-size:clamp(18px,1.9vw,21px);line-height:1.36;margin-bottom:6px}
  .row .a{font-size:14px;line-height:1.5;color:var(--faint);margin-bottom:6px}
  .row .v{font-size:14px;font-weight:500;color:var(--body)}
  .row .foot{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
  .tl{display:flex;gap:12px 28px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line)}
  .tl .y{flex:0 0 122px;font-family:var(--sans);font-size:12px;color:var(--faint);padding-top:5px}
  .tl .b{flex:1 1 300px;min-width:0}
  .tl .b .n{font-size:19px;line-height:1.32;margin-bottom:3px}
  .tl .b .o{font-family:var(--sans);font-size:13px;line-height:1.55;color:var(--mute)}
  .notes{display:grid;gap:7px;margin-top:9px}
  .notes li{display:flex;gap:11px;font-family:var(--sans);font-size:13px;line-height:1.62;color:#55585f;max-width:44em}
  .notes li span:first-child{flex:0 0 auto;color:#c3c7cd}
  .news{display:flex;gap:12px 28px;flex-wrap:wrap;padding:13px 0;border-top:1px solid var(--hair);transition:transform .24s cubic-bezier(.2,.7,.2,1)}
  .news:hover{transform:translateX(5px)}
  .news .d{flex:0 0 116px;font-family:var(--sans);font-size:12px;color:var(--faint);padding-top:3px}
  .news .x{flex:1 1 300px;min-width:0;font-size:17px;line-height:1.58}
  .back{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:clamp(26px,4vw,40px)}
  .detailfig{margin:0 0 12px;padding:clamp(14px,2.6vw,30px);background:var(--panel);border-radius:20px;overflow-x:auto}
  .detailfig svg{min-width:640px}
  .caption{font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--label);max-width:88ch;margin-bottom:clamp(36px,5vw,56px)}
  .sect h2{font-size:clamp(21px,2.3vw,26px);letter-spacing:-.015em;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #D9DBDC}
  .sect p{margin-bottom:14px;font-size:16.5px;line-height:1.7;color:var(--body);max-width:68ch}
  .sect{padding:0 0 clamp(34px,5vw,56px);border-top:0}
  .bullets{display:grid;gap:10px}
  .bullets li{display:flex;gap:12px;font-family:var(--sans);font-size:13.5px;line-height:1.68;color:var(--mute);max-width:44em}
  .bullets li span:first-child{flex:0 0 auto;color:var(--accent)}
  .listrow{display:flex;gap:clamp(18px,3vw,36px);flex-wrap:wrap;align-items:center;padding:clamp(22px,2.8vw,32px) 0;border-bottom:1px solid var(--line);cursor:pointer}
  .listrow:first-of-type{border-top:1px solid #D9DBDC}
  .listrow h2{font-size:clamp(22px,2.5vw,30px);line-height:1.14}
  .listrow:hover h2{color:var(--accent)}
  .listrow .thumb{flex:0 0 clamp(130px,15vw,180px);padding:12px;background:var(--panel);border-radius:14px}
  .listrow .b{flex:1 1 320px;min-width:0}
  .listrow p{margin-top:8px;font-size:15px;line-height:1.6;color:var(--mute);max-width:64ch}
  .btn{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--body);background:#fff;border:1px solid #D9DBDC;border-radius:6px;padding:8px 12px}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;padding:26px 0 40px;margin-top:clamp(20px,3vw,40px);border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--label)}
  footer a{color:var(--label);border-bottom:1px solid #D9DBDC}
  @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  [data-enter]{animation:enter .42s cubic-bezier(.2,.7,.2,1) both}
  [data-sr]{opacity:0;transform:translateY(12px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
  [data-sr].in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){
    [data-sr]{opacity:1;transform:none;transition:none}
    [data-enter]{animation:none}
    .row:hover,.news:hover{transform:none}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="name" href="../index.html">Jinwoo (Kevin) Cho</a>
    <nav>
      <a href="#/projects" data-nav="projects">projects</a>
      <a href="#/publications" data-nav="publications">publications</a>
      <a href="#/cv" data-nav="cv">cv</a>
      <a href="../index.html#contact">contact</a>
    </nav>
  </header>
  <div class="frame">
    <aside class="rail">
      <div class="cap">index</div>
      <div class="items">
        <a href="../index.html"><span>00</span><span>home</span></a>
        <a href="#/projects" data-nav="projects"><span>01</span><span>projects</span></a>
        <a href="#/publications" data-nav="publications"><span>02</span><span>publications</span></a>
        <a href="#/cv" data-nav="cv"><span>03</span><span>cv</span></a>
      </div>
    </aside>
    <main id="main"></main>
  </div>
</div>
<script src="data.js"></script>
<script src="figures.js"></script>
<script>
const DATA = window.DATA;
const CITATIONS = 257;
const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const FIGS = window.FIGS;

const notes = (ns) => !ns || !ns.length ? '' : '<ul class="notes">' + ns.map((n) => '<li><span>&mdash;</span><span>' + esc(n) + '</span></li>').join('') + '</ul>';
const pubRow = (p) => '<div class="row"><div class="t">' + esc(p.title) + '</div><div class="a">' + esc(p.authors) + '</div><div class="foot"><span class="v">' + esc(p.venue || p.group) + '</span>' + (p.link ? '<a class="more" href="' + esc(p.url) + '">' + esc(p.link) + '</a>' : '') + '</div></div>';
const tlRow = (it) => '<div class="tl"><div class="y">' + esc(it.year) + '</div><div class="b"><div class="n">' + esc(it.title) + '</div>' + (it.org ? '<div class="o">' + esc(it.org) + '</div>' : '') + notes(it.notes) + '</div></div>';

const hero = (eyebrow, title, lead, acts) => '<div class="hero"><div class="eyebrow">' + eyebrow + '</div><h1>' + title + '</h1>' + (lead ? '<p class="plead">' + lead + '</p>' : '') + (acts ? '<div class="acts">' + acts + '</div>' : '') + '</div>';
const HOME = '<a href="../index.html">&larr; home</a>';

function projectPage(slug) {
  const p = DATA.projects.find((x) => x.slug === slug);
  if (!p) return projectsPage();
  return '<article class="page" data-enter>' +
    hero('<span>' + esc(p.kind) + ' &middot; ' + esc(p.meta) + '</span><a href="#/projects">&larr; all projects</a>', esc(p.title), esc(p.body)) +
    '<figure class="detailfig">' + FIGS.wide(p.slug) + '</figure><p class="caption">' + esc(FIGS.caption(p.slug)) + '</p>' +
    p.sections.map((s) => '<section class="sect"><h2>' + esc(s.heading) + '</h2>' + (s.body ? '<p>' + esc(s.body) + '</p>' : '') + (s.bullets && s.bullets.length ? '<ul class="bullets">' + s.bullets.map((b) => '<li><span>&mdash;</span><span>' + esc(b) + '</span></li>').join('') + '</ul>' : '') + '</section>').join('') +
    '<div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="#/projects">&larr; All projects</a><a class="btn" href="mailto:jinoojwcho@cmu.edu">Ask about this work</a></div>' +
  '</article>';
}

function projectsPage() {
  return '<article class="page" data-enter>' +
    hero('<span>projects &middot; ' + DATA.projects.length + ' entries</span>' + HOME, 'Projects', 'From the current manuscripts back to earlier applied work.') +
    DATA.projects.map((p) => '<a class="listrow" href="#/p/' + p.slug + '"><div class="b"><div class="top" style="display:flex;gap:10px;align-items:baseline;margin-bottom:8px"><span class="kind">' + esc(p.kind) + '</span><span class="meta">' + esc(p.meta) + '</span></div><h2>' + esc(p.title) + '</h2><p>' + esc(p.body) + '</p></div><div class="thumb">' + FIGS.plate(p.slug) + '</div></a>').join('') +
    '</article>';
}

function pubsPage() {
  const groups = ['In preparation', 'Submitted', 'Published'];
  return '<article class="page" data-enter>' +
    hero('<span>publications &middot; ' + DATA.publications.length + ' entries &middot; ' + CITATIONS + ' citations</span>' + HOME, 'Publications', '', '<a class="btn" href="https://scholar.google.com/citations?user=Ls13qzcAAAAJ">Google Scholar</a>') +
    groups.map((g) => {
      const items = DATA.publications.filter((p) => p.group === g);
      if (!items.length) return '';
      return '<section class="sect"><h2>' + esc(g) + '</h2>' + items.map(pubRow).join('') + '</section>';
    }).join('') +
    '</article>';
}

function cvPage() {
  return '<article class="page" data-enter>' +
    hero('<span>curriculum vitae</span>' + HOME, 'Curriculum Vitae', '', '<a class="btn" href="../assets/pdf/Jinwoo_Cho_CV.pdf">Download PDF</a>') +
    DATA.cv.map((b) => '<section class="sect"><h2>' + esc(b.heading) + '</h2>' + b.items.map(tlRow).join('') + '</section>').join('') +
    '</article>';
}

const main = document.getElementById('main');
const FOOT = '<footer><span>Department of Statistics &amp; Data Science, Carnegie Mellon University</span><span><a href="../index.html">&larr; home</a></span></footer>';
let io;

function reveal() {
  if (!io) {
    io = new IntersectionObserver((es) => es.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }), { rootMargin: '0px 0px -6% 0px', threshold: .04 });
  }
  document.querySelectorAll('[data-sr]:not(.in)').forEach((el) => io.observe(el));
}

function spy(path) {
  const cur = path.indexOf('p/') === 0 ? 'projects' : path;
  document.querySelectorAll('[data-nav]').forEach((a) => a.setAttribute('data-active', a.getAttribute('data-nav') === cur ? '1' : '0'));
}

function route() {
  const path = location.hash.replace(/^#\/?/, '').split('#')[0].replace(/\/$/, '');
  let view;
  if (path.indexOf('p/') === 0) view = projectPage(path.slice(2));
  else if (path === 'projects') view = projectsPage();
  else if (path === 'publications') view = pubsPage();
  else if (path === 'cv') view = cvPage();
  else { location.replace('../index.html'); return; }
  main.innerHTML = view + FOOT;
  reveal();
  window.scrollTo(0, 0);
  spy(path);
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
