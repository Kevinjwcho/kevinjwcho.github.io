    network: L(40,22,120,52)+L(120,52,218,24)+L(218,24,272,62)+L(120,52,160,76)+L(40,22,96,74)+L(96,74,160,76)+L(218,24,160,76)+C(40,22)+C(120,52)+C(218,24)+C(272,62)+C(96,74)+C(160,76),
    netcurve: P('M6 68 C 52 64, 78 32, 112 44 S 178 22, 214 36 S 266 20, 294 14')+L(112,44,178,30)+L(178,30,240,42)+L(112,44,150,72)+L(150,72,240,42)+C(112,44)+C(178,30)+C(240,42)+C(150,72),
    fan: L(6,76,294,76,'#e0e2e6')+P('M10 70 C 80 66, 170 58, 290 50')+P('M10 70 C 80 58, 170 40, 290 22','#c3c7cd')+P('M10 70 C 80 62, 170 50, 290 36')+P('M10 70 C 80 68, 170 66, 290 62','#c3c7cd')+C(290,22)+C(290,62),
    window: '<rect x="96" y="12" width="78" height="64" fill="#0066CC" stroke="none"/>'+P('M6 46 L 26 38 L 40 54 L 58 34 L 76 50 L 94 36 L 112 58 L 130 30 L 148 62 L 166 34 L 184 52 L 202 26 L 220 56 L 238 40 L 256 50 L 274 36 L 294 48')+L(96,6,96,82)+L(174,6,174,82)+C(130,30,2.8)+C(148,62,2.8),
    band: L(6,76,294,76,'#e0e2e6')+P('M6 30 C 60 26, 120 40, 176 32 S 250 22, 294 18','#c3c7cd')+P('M6 62 C 60 58, 120 70, 176 62 S 250 54, 294 50','#c3c7cd')+P('M6 46 C 60 42, 120 56, 176 46 S 250 38, 294 34')+C(212,22)+C(212,54),
    cross: L(6,76,294,76,'#e0e2e6')+P('M6 66 C 70 62, 140 48, 210 32 S 270 18, 294 12')+P('M6 26 C 70 32, 140 44, 210 56 S 270 66, 294 70','#c3c7cd')+L(186,8,186,80)+C(186,40),
    tree: P('M14 44 L 70 44')+P('M70 20 L 70 68')+P('M70 20 L 128 20')+P('M70 68 L 112 68')+P('M128 10 L 128 30')+P('M112 54 L 112 80')+P('M128 10 L 196 10')+P('M128 30 L 176 30')+P('M112 54 L 188 54')+P('M112 80 L 170 80')+C(196,10)+C(176,30)+C(188,54)+C(170,80)
  };
})();
const glyph = (k) => '<svg class="gl" viewBox="0 0 300 88" width="100%" fill="none" stroke-width="1.3" stroke-linecap="round" aria-hidden="true" style="display:block;height:auto">' + (GL[k] || GL.trajectory) + '</svg>';

const notes = (ns) => !ns || !ns.length ? '' : '<ul class="notes">' + ns.map((n) => '<li><span>&mdash;</span><span>' + esc(n) + '</span></li>').join('') + '</ul>';
const pubRow = (p) => '<div class="row"><div class="t">' + esc(p.title) + '</div><div class="a">' + esc(p.authors) + '</div><div class="foot"><span class="v">' + esc(p.venue || p.group) + '</span>' + (p.link ? '<a class="more" href="' + esc(p.url) + '">' + esc(p.link) + '</a>' : '') + '</div></div>';
const tlRow = (it) => '<div class="tl"><div class="y">' + esc(it.year) + '</div><div class="b"><div class="n">' + esc(it.title) + '</div>' + (it.org ? '<div class="o">' + esc(it.org) + '</div>' : '') + notes(it.notes) + '</div></div>';

function landing() {
  const featured = DATA.projects.slice(0, 4);
  return '<section data-enter>' +
    '<p class="lead">Predicting risk from data that arrive over time, on networks, and in high dimensions.</p>' +
    '<p class="intro">I build statistical methods for data that arrive with structure attached. Three threads run through the work: network data analysis, dynamic prediction in survival analysis, and high-dimensional estimation that uses a known network as prior information. At CMU I work with Dr. Nynke Niezink on longitudinal three-way network analysis at the Institute of Complex Social Dynamics. I earned my Ph.D. in Statistics from the University of Pittsburgh under Dr. Kehui Chen, working on dynamic prediction for survival outcomes and network-assisted functional data analysis. Before that I was a Research Associate at the Seoul National University College of Medicine, analyzing gene expression and methylation data, microbiome compositions, and time-series biomarkers.</p>' +
  '</section>' +
  '<section id="projects" data-sr><div class="head"><h2 class="label">Selected Projects</h2><a class="more" href="#/projects">All ' + DATA.projects.length + ' projects &rarr;</a></div><div class="grid">' +
    featured.map((p) => '<a class="card" href="#/p/' + p.slug + '"><div class="rule"></div><div class="top"><span class="kind">' + esc(p.kind) + '</span><span class="meta">' + esc(p.meta) + '</span></div><h3>' + esc(p.title) + '</h3><div class="reveal"><div class="fig">' + glyph(p.glyph) + '</div><p>' + esc(p.body) + '</p></div></a>').join('') +
  '</div></section>' +
  '<section id="software" data-sr><h2 class="label" style="margin-bottom:18px">Software</h2>' +
    DATA.software.map((s) => '<div class="sw"><div style="flex:1 1 300px;min-width:0"><div style="display:flex;gap:10px;align-items:baseline;margin-bottom:5px"><span class="name">' + esc(s.name) + '</span><span class="kind">' + esc(s.status) + '</span></div><p>' + esc(s.body) + '</p></div><a class="more" href="' + esc(s.url) + '">' + esc(s.link) + '</a></div>').join('') +
  '</section>' +
  '<section id="publications" data-sr><div class="head"><h2 class="label">Selected Publications</h2><a class="more" href="#/publications">All ' + DATA.publications.length + ' publications &rarr;</a></div>' +
    DATA.publications.filter((p) => p.selected).map(pubRow).join('') +
  '</section>' +
  '<section id="cv" data-sr><div class="head"><h2 class="label">Appointments &amp; Education</h2><a class="more" href="#/cv">Full CV &rarr;</a></div>' +
    DATA.cvSummary.map((c) => '<div class="tl"><div class="y">' + esc(c.year) + '</div><div class="b"><div class="n">' + esc(c.title) + '</div><div class="o">' + esc(c.org) + '</div></div></div>').join('') +
  '</section>' +
  '<section id="news" data-sr><h2 class="label" style="margin-bottom:18px">News</h2>' +
    DATA.news.map((n) => '<div class="news"><div class="d">' + esc(n.date) + '</div><div class="x">' + esc(n.text) + '</div></div>').join('') +
  '</section>';
}

function projectPage(slug) {
  const p = DATA.projects.find((x) => x.slug === slug);
  if (!p) return landing();
  return '<article class="page" data-enter><a class="back" href="#/">&larr; All projects</a>' +
    '<div class="top" style="display:flex;gap:10px;align-items:baseline;margin-bottom:10px"><span class="kind">' + esc(p.kind) + '</span><span class="meta">' + esc(p.meta) + '</span></div>' +
    '<h1>' + esc(p.title) + '</h1><p class="plead">' + esc(p.body) + '</p>' +
    '<div class="detailfig">' + glyph(p.glyph) + '</div>' +
    p.sections.map((s) => '<section class="sect"><h2>' + esc(s.heading) + '</h2>' + (s.body ? '<p>' + esc(s.body) + '</p>' : '') + (s.bullets && s.bullets.length ? '<ul class="bullets">' + s.bullets.map((b) => '<li><span>&mdash;</span><span>' + esc(b) + '</span></li>').join('') + '</ul>' : '') + '</section>').join('') +
    '<div style="padding-top:20px;border-top:1px solid var(--line);display:flex;gap:14px 28px;flex-wrap:wrap"><a class="back" style="margin:0" href="#/">&larr; All projects</a><a class="more" style="color:var(--label)" href="mailto:jinoojwcho@cmu.edu">Ask about this work</a></div>' +
  '</article>';
}

function projectsPage() {
  return '<article class="page" data-enter><a class="back" href="#/">&larr; Back</a><h1>Projects</h1>' +
    '<p class="meta" style="margin:12px 0 clamp(28px,4vw,42px)">' + DATA.projects.length + ' projects, from the current manuscript back to earlier applied work.</p>' +
    DATA.projects.map((p) => '<a class="listrow" href="#/p/' + p.slug + '"><div class="thumb">' + glyph(p.glyph) + '</div><div class="b"><div class="top" style="display:flex;gap:10px;align-items:baseline;margin-bottom:4px"><span class="kind">' + esc(p.kind) + '</span><span class="meta">' + esc(p.meta) + '</span></div><h2 style="font-weight:500;font-size:clamp(20px,2.1vw,24px);line-height:1.2">' + esc(p.title) + '</h2><p>' + esc(p.body) + '</p></div></a>').join('') +
    '<div style="padding-top:20px;border-top:1px solid var(--line)"><a class="back" style="margin:0" href="#/">&larr; Back</a></div></article>';
}

function pubsPage() {
  const groups = ['In preparation', 'Submitted', 'Published'];
  return '<article class="page" data-enter><a class="back" href="#/">&larr; Back</a><h1 style="margin-bottom:clamp(28px,4vw,42px)">Publications</h1>' +
    groups.map((g) => {
      const items = DATA.publications.filter((p) => p.group === g);
      if (!items.length) return '';
      return '<section class="sect" style="padding-top:0"><h2>' + esc(g) + '</h2>' + items.map(pubRow).join('') + '</section>';
    }).join('') +
    '<div style="padding-top:20px;border-top:1px solid var(--line)"><a class="back" style="margin:0" href="#/">&larr; Back</a></div></article>';
}

function cvPage() {
  return '<article class="page" data-enter><a class="back" href="#/">&larr; Back</a>' +
    '<div style="display:flex;flex-wrap:wrap;gap:14px 24px;align-items:baseline;justify-content:space-between;margin-bottom:clamp(30px,4vw,44px)"><h1>Curriculum Vitae</h1><a class="btn" href="../assets/pdf/Jinwoo_Cho_CV.pdf">Download PDF</a></div>' +
    DATA.cv.map((b) => '<section class="sect" style="padding-top:0"><h2>' + esc(b.heading) + '</h2>' + b.items.map(tlRow).join('') + '</section>').join('') +
    '<div style="padding-top:20px;border-top:1px solid var(--line)"><a class="back" style="margin:0" href="#/">&larr; Back</a></div></article>';
}

const main = document.getElementById('main');
const FOOT = '<footer><span>&copy; 2026 Jinwoo Cho</span><span>Pittsburgh, PA</span></footer>';
let io;

function reveal() {
  if (!io) {
    io = new IntersectionObserver((es) => es.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }), { rootMargin: '0px 0px -6% 0px', threshold: .04 });
  }
  document.querySelectorAll('[data-sr]:not(.in)').forEach((el) => io.observe(el));
}

function spy() {
  const links = Array.from(document.querySelectorAll('[data-nav]'));
  let cur = null;
  links.forEach((a) => {
    const s = document.getElementById(a.getAttribute('data-nav'));
    if (s && s.getBoundingClientRect().top <= 140) cur = a;
  });
  links.forEach((a) => a.setAttribute('data-active', a === cur ? '1' : '0'));
}

function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const anchor = h.indexOf('#') >= 0 ? h.slice(h.indexOf('#') + 1) : '';
  const path = (anchor ? h.slice(0, h.indexOf('#')) : h).replace(/\/$/, '');
  let view;
  if (path.indexOf('p/') === 0) view = projectPage(path.slice(2));
  else if (path === 'projects') view = projectsPage();
  else if (path === 'publications') view = pubsPage();
  else if (path === 'cv') view = cvPage();
  else view = landing();
  main.innerHTML = view + FOOT;
  reveal();
  if (anchor) {
    const el = document.getElementById(anchor);
    if (el) window.scrollTo(0, el.getBoundingClientRect().top + window.pageYOffset - 24);
  } else {
    window.scrollTo(0, 0);
  }
  spy();
  requestAnimationFrame(spy);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(spy);
}

window.addEventListener('load', spy);
window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => {
  if (window.__raf) return;
  window.__raf = requestAnimationFrame(() => { window.__raf = null; spy(); });
}, { passive: true });
route();
</script>
</body>
